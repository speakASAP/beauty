    depends_on:
      nats:
        condition: service_healthy
    networks:
      - beauty-network
      - nginx-network
      # nginx-network required for shared database-server and microservices access
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4115/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Integration Hub Service
  integration-hub-service:
    build:
      context: ./services/integration-hub-service
      dockerfile: Dockerfile
    container_name: beauty-integration-hub-service
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${INTEGRATION_HUB_SERVICE_PORT:-4116}
      DATABASE_URL: postgresql://${DB_USER:-dbadmin}:${DB_PASSWORD}@${DB_HOST:-db-server-postgres}:${DB_PORT:-5432}/${DB_NAME:-beauty_platform}
      NATS_URL: nats://nats:4222
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://notifications-microservice:${NOTIFICATIONS_MICROSERVICE_PORT:-3368}}
      CATALOG_MICROSERVICE_URL: ${CATALOG_MICROSERVICE_URL:-http://catalog-microservice:${CATALOG_MICROSERVICE_PORT:-3200}}
      ACCOUNTING_SERVICE_URL: ${ACCOUNTING_SERVICE_URL:-http://accounting-service:${ACCOUNTING_SERVICE_PORT:-3367}}
      ACCOUNTING_SYSTEM: ${ACCOUNTING_SYSTEM:-money_s3}
      LOGGING_SERVICE_URL: ${LOGGING_SERVICE_URL:-http://logging-microservice:${LOGGING_MICROSERVICE_PORT:-3367}}
      SERVICE_NAME: integration-hub-service
    ports:
      - "${INTEGRATION_HUB_SERVICE_PORT:-4116}:4116"
    depends_on:
      nats:
        condition: service_healthy
    networks:
      - beauty-network
      - nginx-network
      # nginx-network required for shared database-server and microservices access
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4116/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  beauty-network:
    driver: bridge
  nginx-network:
    external: true
    name: nginx-network
    # Services need nginx-network to access shared database-server and microservices

