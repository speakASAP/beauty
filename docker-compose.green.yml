services:
  # Frontend (Green Environment) - Simplified for fast deployment
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${API_GATEWAY_URL:-http://localhost:4100}
    container_name: beauty-frontend-green
    ports:
      - "${FRONTEND_PORT:-4102}:4173"
    networks:
      - nginx-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4173/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  nginx-network:
    external: true
    name: nginx-network
