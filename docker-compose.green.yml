services:
  # Public Website (Green Environment) - Next.js franchise landing page
  public-website:
    build:
      context: ./public-website
      dockerfile: Dockerfile
    container_name: beauty-public-website-green
    environment:
      NODE_ENV: production
      BOOKING_API_URL: ${BOOKING_API_URL:-http://booking-service:4110}
      NEXT_PUBLIC_TENANT_ID: ${NEXT_PUBLIC_TENANT_ID:-}
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-false}
    ports:
      - "${PUBLIC_WEBSITE_PORT:-4102}:3000"
    networks:
      - nginx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  nginx-network:
    external: true
    name: nginx-network
